name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A database-dependent preflight must not cancel the last compatible release.
  group: ${{ vars.KOLDOVSTVO_COMBAT_RECEIPTS_READY == 'true' && 'pages' || 'pages-combat-receipts-preflight' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/chat-checks.yml
    permissions:
      contents: read

  build:
    needs: checks
    if: vars.KOLDOVSTVO_COMBAT_RECEIPTS_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # публичные значения проекта Supabase: Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_LOGIN_EMAIL_DOMAIN: ${{ vars.VITE_LOGIN_EMAIL_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
