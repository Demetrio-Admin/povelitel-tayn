name: Verify the public V2 playtest link
on:
  push:
    branches: ['v2/episode-1']
    paths: ['.github/workflows/v2-pages.yml', 'play.html']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the branch playtest and check the first interaction
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const repo = 'Demetrio-Admin/povelitel-tayn';
          const revision = '4724ac0a76614ee17a86044c44a2574ace0f3a8a';
          const candidates = [
            ['GitHub Preview', 'https://htmlpreview.github.io/?https://github.com/' + repo + '/blob/v2/episode-1/play.html'],
            ['GitHub Preview (pinned)', 'https://htmlpreview.github.io/?https://github.com/' + repo + '/blob/' + revision + '/play.html'],
            ['GitHub HTML CDN', 'https://rawcdn.githack.com/' + repo + '/' + revision + '/play.html'],
          ];
          const browser = await chromium.launch();
          try {
            const passed = await Promise.all(candidates.map(async ([name, url]) => {
              const page = await browser.newPage();
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 18000 });
                await page.getByRole('button', { name: 'Дальше', exact: true }).click({ timeout: 18000 });
                assert.match(await page.locator('.dialogue').innerText(), /Не бойся мелких искр/);
                const assetsLoaded = await page.evaluate(() => [...document.images].every(image => image.complete && image.naturalWidth > 0));
                assert.ok(assetsLoaded);
                console.log('PLAYABLE ' + name + ' ' + url);
                return true;
              } catch (error) {
                console.log('FAILED ' + name + ' ' + String(error).split('\n')[0]);
                return false;
              } finally {
                await page.close();
              }
            }));
            assert.ok(passed.some(Boolean), 'No public playtest link loaded in the browser');
          } finally {
            await browser.close();
          }
          JS
