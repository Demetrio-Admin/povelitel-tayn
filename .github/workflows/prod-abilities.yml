# Временно: кнопки даров в боевой (минифицированной) сборке
name: Prod abilities
on:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && ls dist/assets | grep -i "^index" | tee out.txt
      - run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          sleep 6; cat preview.log
          BASE=$(grep -o 'http://127.0.0.1:4173[^ ]*' preview.log | head -1)
          echo "BASE=$BASE"
          UI_BASE_URL="$BASE" node tests/e2e/abilities.mjs 2>&1 | tee -a out.txt
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          t = (open('out.txt').read() if os.path.exists('out.txt') else 'нет вывода')[-60000:]
          body = {'name': 'log prod', 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'log', 'summary': 'x', 'text': t}}
          open('/tmp/b.json', 'w').write(json.dumps(body))
          subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/check-runs', '--method', 'POST', '--input', '/tmp/b.json', '--silent'])
          PY
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        ref: [98304db5c4063e9f5bdad3bf7814119a9dffa2a1, 4d8b4bf4a27d9deab3a1da1d5d496c70c2f339a3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && ls dist/assets | grep -i "^index" | tee out.txt
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ matrix.ref }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          t = open('out.txt').read()
          body = {'name': 'hash ' + os.environ['REF'][:7], 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'h', 'summary': t, 'text': t}}
          open('/tmp/b.json', 'w').write(json.dumps(body))
          subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/check-runs', '--method', 'POST', '--input', '/tmp/b.json', '--silent'])
          PY
