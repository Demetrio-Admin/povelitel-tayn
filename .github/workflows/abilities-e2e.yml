# Временно: ищем, почему не нажимаются кнопки даров (до и после v0.27.0)
name: Abilities e2e
on:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: [e000cbaad1fe699624597594dd7f09002f84c538, 98304db]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout ${{ matrix.ref }} && git checkout ${{ github.sha }} -- tests/e2e/abilities.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/abilities.mjs 2>&1 | tee out.txt
        env:
          AB_SHOTS_DIR: shots
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ matrix.ref }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, io, base64, os, json, subprocess
          from PIL import Image
          def post(name, text, summary='x'):
              body = {'name': name, 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': name, 'summary': summary, 'text': text}}
              open('/tmp/b.json', 'w').write(json.dumps(body))
              subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/check-runs', '--method', 'POST', '--input', '/tmp/b.json', '--silent'], check=False)
          r = os.environ['REF'][:7]
          post('log ' + r, open('out.txt').read()[-60000:] if os.path.exists('out.txt') else 'нет вывода')
          for f in sorted(glob.glob('shots/*.png')):
              im = Image.open(f).convert('RGB'); im.thumbnail((390, 844))
              q = 70
              while True:
                  b = io.BytesIO(); im.save(b, 'JPEG', quality=q); t = base64.b64encode(b.getvalue()).decode()
                  if len(t) < 64000 or q < 20: break
                  q -= 10
              post('shot %s %s' % (r, os.path.basename(f)[:-4]), t)
          PY
