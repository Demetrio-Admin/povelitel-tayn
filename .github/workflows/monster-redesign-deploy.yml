name: Prepare and test 25 enemy sprites
on:
  push:
    branches:
      - art/monster-redesign-deploy-20261023
permissions:
  contents: write
jobs:
  sprites:
    if: "contains(github.event.head_commit.message, '[monster-staging]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract 25 RGBA cutouts and validate against art manifest
        run: |
          python3 - <<'PY'
          import sys, struct
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('tools/art/monster-redesign/staged-drafts.zip')
          dest = Path('public/assets/monster-redesign')
          dest.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              items = [i for i in z.namelist() if i.startswith('transparent_draft/') and i.endswith('.png')]
              assert len(items) == 25, f'Expected exactly 25 cutouts, got {len(items)}'
              for n in range(1,26):
                  name = f'transparent_draft/{n:02}.png'
                  payload = z.read(name)
                  assert payload.startswith(b'\x89PNG\r\n\x1a\n'), f'Bad PNG {name}'
                  w,h,depth,colour = struct.unpack('>IIBB', payload[16:26])
                  assert 60 <= w <= 2048 and 60 <= h <= 2048 and colour == 6 and depth == 8, f'Not RGBA {name}: {w}x{h} mode{colour} depth{depth}'
                  (dest / f'{n:02}.png').write_bytes(payload)
          print('Validated 25 PNG sprites; all RGBA with sane dimensions')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified sprite files (remove transfer archive and temporary workflow)
        run: |
          rm tools/art/monster-redesign/staged-drafts.zip
          rm .github/workflows/monster-redesign-deploy.yml
          git add -A public/assets/monster-redesign tools/art/monster-redesign .github/workflows/monster-redesign-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: unpack and verify 25 RGBA monster sprites"
          git push origin HEAD:art/monster-redesign-deploy-20261023
