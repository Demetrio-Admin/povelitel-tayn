# Временная проверка v0.28.0 в настоящем Phaser (удаляется перед слиянием)
name: Life e2e
on:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:life 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          LIFE_SHOTS_DIR: shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-shots
          path: shots
      - name: report as check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          t = open('out.txt').read()[-30000:] if os.path.exists('out.txt') else 'нет вывода'
          body = {'name': 'report life', 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'report', 'summary': 'log', 'text': '```\n' + t + '\n```'}}
          open('/tmp/r.json', 'w').write(json.dumps(body))
          subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/check-runs', '--method', 'POST', '--input', '/tmp/r.json', '--silent'], check=False)
          PY
      - name: shots as check runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, io, base64, os, json, subprocess
          from PIL import Image
          for f in sorted(glob.glob('shots/*.png')):
              im = Image.open(f).convert('RGB'); im.thumbnail((390, 844))
              q = 70
              while True:
                  b = io.BytesIO(); im.save(b, 'JPEG', quality=q); t = base64.b64encode(b.getvalue()).decode()
                  if len(t) < 64000 or q < 20: break
                  q -= 10
              body = {'name': 'shot ' + os.path.basename(f)[:-4], 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'neutral',
                      'output': {'title': 'shot', 'summary': 'jpeg base64', 'text': t}}
              open('/tmp/b.json', 'w').write(json.dumps(body))
              subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/check-runs', '--method', 'POST', '--input', '/tmp/b.json', '--silent'], check=False)
          PY
