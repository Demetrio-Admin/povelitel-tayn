name: Check public browser access to the v2 episode
on:
  push:
    branches: ['v2/episode-1']
    paths: ['.github/workflows/v2-preview-check.yml', 'play.html']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the branch playtest and check the first interaction
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const repo = 'Demetrio-Admin/povelitel-tayn';
          const revision = process.env.GITHUB_SHA;
          const candidates = [
            ['GitHub Preview', 'https://htmlpreview.github.io/?https://github.com/' + repo + '/blob/v2/episode-1/play.html'],
            ['GitHub Preview (pinned)', 'https://htmlpreview.github.io/?https://github.com/' + repo + '/blob/' + revision + '/play.html'],
          ];
          const endpoints = [
            'https://raw.githubusercontent.com/' + repo + '/' + revision + '/play.html',
            'https://cdn.jsdelivr.net/gh/' + repo + '@' + revision + '/play.html',
          ];
          await Promise.all(endpoints.map(async url => {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
              const text = await response.text();
              console.log('SOURCE ' + url + ' ' + response.status + ' ' + text.length + ' ' + text.includes('const previewImages'));
            } catch (error) {
              console.log('SOURCE FAILED ' + url + ' ' + error.message);
            }
          }));
          const browser = await chromium.launch();
          try {
            const passed = await Promise.all(candidates.map(async ([name, url]) => {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 15000 });
                console.log('HTTP ' + name + ' ' + response?.status() + ' ' + response?.headers()['content-type']);
                await page.getByRole('button', { name: 'Дальше', exact: true }).click({ timeout: 12000 });
                assert.match(await page.locator('.dialogue').innerText(), /Не бойся мелких искр/);
                const assetsLoaded = await page.evaluate(() => [...document.images].every(image => image.complete && image.naturalWidth > 0));
                assert.ok(assetsLoaded);
                console.log('PLAYABLE ' + name + ' ' + url);
                return true;
              } catch (error) {
                console.log('FAILED ' + name + ' ' + String(error).split('\n')[0]);
                console.log('DIAGNOSTIC ' + name + ' ' + (await page.title()) + ' ' + (await page.locator('body').innerText({ timeout: 2000 }).catch(()=>'')).slice(0, 200) + ' ' + JSON.stringify(pageErrors));
                return false;
              } finally {
                await page.close();
              }
            }));
            assert.ok(passed.some(Boolean), 'No public playtest link loaded in the browser');
          } finally {
            await browser.close();
          }
          JS
